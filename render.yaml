# Render Blueprint: one web service serves the API and the built frontend.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: gridsync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SITE_TZ
        value: America/Chicago
      # Paste the contents of backend/keys/ed25519.pem (local, gitignored) so the
      # deployed server signs with the same key as the committed mock certificate.
      # Without it, a new key is generated on every restart.
      - key: GRIDSYNC_ED25519_KEY
        sync: false
